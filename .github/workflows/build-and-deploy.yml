name: Build data and deploy

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC: picks up new BTS months and keeps the data cache warm
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: write   # lets the job commit the summary CSVs in exports/
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      # Raw monthly Parquet files persist between runs so only new months are downloaded.
      - name: Restore BTS cache
        uses: actions/cache/restore@v4
        with:
          path: pipeline/bts_parquet
          key: bts-${{ github.run_id }}
          restore-keys: bts-

      - name: Ingest BTS months
        run: python pipeline/ingest.py

      - name: Save BTS cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/bts_parquet
          key: bts-${{ github.run_id }}

      - name: Build site data
        run: python pipeline/build_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate against prototype fixture (DFW-GSO, AA, Jun 2025 - May 2026)
        run: node pipeline/validate_fixture.mjs

      - name: Export summary CSVs
        run: python pipeline/export_summary.py

      - name: Commit summary CSVs to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add exports
          if git diff --cached --quiet; then
            echo "Summary CSVs unchanged"
          else
            git commit -m "Update summary exports"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
